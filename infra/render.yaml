# Render Blueprint for the API (optional: you can create the same service by hand in the dashboard, see docs/runbook.md).
# Secrets use `sync: false`: Render asks for them in the dashboard and they are never stored in git.
#
# FREE plan: the service sleeps after ~15 min idle (first request then takes ~1 minute) and Render's
# `preDeployCommand` is not available, so migrations run at start-up (RUN_MIGRATIONS=true, handled by the image's default command).
# STARTER plan (recommended for real use): set `plan: starter`, remove RUN_MIGRATIONS, and use
# `preDeployCommand: alembic upgrade head` instead.
services:
  - type: web
    name: collections-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: STORAGE_BACKEND
        value: supabase
      - key: QR_BUCKET
        value: qr
      - key: RECEIPTS_BUCKET
        value: receipts
      - key: OCR_ENABLED
        value: "true"                  # scanned PDFs (Tesseract is installed in the image)
      - key: DATABASE_URL
        sync: false                    # Supabase *Session pooler* string (port 5432)
      - key: CORS_ORIGINS
        sync: false                    # the Pages origin only, e.g. https://aurasmart.github.io
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                    # secret, backend only
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: TOKEN_ENC_KEY
        sync: false
      - key: TOKEN_HMAC_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false                    # optional: private Google Sheets only (set both or neither)
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
