[project]
name = "collections-api"
version = "0.1.0"
description = "Collection management API and worker (Phase 0 foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.10",
    "cryptography>=43,<51",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "pdfplumber>=0.11.10",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "reportlab>=5.0.1",
    "xlwt>=1.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*", "openpyxl.*", "xlrd.*", "xlwt.*", "pytesseract.*", "pdfplumber.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
